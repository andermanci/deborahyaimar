[build]
  command   = "npm run build"
  publish   = "dist"

# El QR impreso apunta SIEMPRE aquí, nunca a /galeria directamente.
# Si algo falla el día de la boda, se cambia este destino en un despliegue
# de 30 segundos sin tener que reimprimir nada.
[[redirects]]
  from   = "/fotos"
  to     = "/galeria/"
  status = 302
  force  = true

# El panel vivía en una URL no adivinable; ahora está en /admin y el acceso lo
# protege el login. Se redirige para no dejar muerto ningún enlace guardado.
[[redirects]]
  from   = "/admin-68895abc"
  to     = "/admin/"
  status = 301
  force  = true
